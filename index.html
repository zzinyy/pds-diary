<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>플랜두씨 다이어리 — 계획 · 실행 · 돌아보기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div class="wrap" id="auth-root">
    <div class="banner">이 화면 뒤의 내 기록은 로그인해야만 보입니다. 계정을 만들거나 로그인하세요.</div>
    <div class="card" id="auth-card"></div>
  </div>

  <div class="wrap" id="app-root" style="display:none">
    <header class="app-header">
      <div>
        <h1>플랜두씨 다이어리</h1>
        <div class="sub">계획(Plan) → 실제로 한 일(Do) → 돌아보기(See)</div>
      </div>
      <div class="row">
        <button class="btn" id="btn-export">내 자료 전체 내보내기</button>
        <button class="btn danger" id="btn-delete-account">계정·자료 삭제</button>
        <button class="btn" id="btn-logout">로그아웃</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="active" data-tab="plan">계획</button>
      <button data-tab="todos">할 일</button>
      <button data-tab="exec">실행 기록</button>
      <button data-tab="review">돌아보기</button>
    </nav>

    <section id="panel-plan" class="panel active"></section>
    <section id="panel-todos" class="panel"></section>
    <section id="panel-exec" class="panel"></section>
    <section id="panel-review" class="panel"></section>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
